<div class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-logo">🔑</div>
      <h1 class="brand-name">ZenBotChat</h1>
      <p class="brand-tagline">Reset your password</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-subtitle">Enter your email and we'll send a reset link</p>

      @if (error) {
        <div class="alert alert-error"><span>⚠️</span> {{ error }}</div>
      }
      @if (success) {
        <div class="alert alert-success"><span>✅</span> {{ success }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input
            type="email"
            formControlName="email"
            class="form-input"
            [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
            placeholder="you@example.com"
            autocomplete="email"
          />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <span class="form-error">Enter a valid email address</span>
          }
        </div>

        <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span> Sending...
          } @else {
            Send Reset Link
          }
        </button>
      </form>

      <p class="auth-switch">
        Remember your password?
        <a routerLink="/auth/login" class="auth-link">Sign in</a>
      </p>
    </div>
  </div>
</div>
